<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>2026 — Sycamore Cup Classic</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/scoring.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="hero-plain">
  <div class="wrap">
    <p class="eyebrow">Southern Hills · Bay Hill · Evermore Cypress</p>
    <h1>2026 <em>Sycamore Cup</em></h1>
    <p class="lead">Three teams, four rounds, one Cup. Team and individual scores update live as the guys tap them in on the course.</p>
    <div class="hero-cta-row">
      <a class="btn btn-primary" href="../scoring.html">Enter Scores →</a>
      <a class="btn btn-light" href="../players.html">Player Directory</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow">The Field</span><h2>Three Teams, Twelve Guys</h2></div>
    </div>
    <div id="team-rosters"></div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow">Live</span><h2>Leaderboard</h2></div>
    </div>
    <div class="liv-board" id="liv-board"></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="eyebrow">Round By Round</span><h2>Schedule</h2></div>
    </div>
    <div class="card" style="padding:8px 28px;">
      <div id="schedule"></div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="../js/app.js"></script>
<script type="module">
  import { TEAMS, PLAYERS, ROUNDS, COURSES, teamRoster } from '../js/tournament-2026.js';

  initShell('2026');

  // ---------- team roster cards ----------
  // Order requested: Starz & Scrubz, then Bison Boys, then Frombys.
  const TEAM_ORDER = ['team-3', 'team-1', 'team-2'];

  document.getElementById('team-rosters').innerHTML = TEAM_ORDER.map(teamId => {
    const team = TEAMS.find(t => t.id === teamId);
    const roster = teamRoster(teamId);
    const combined = roster.reduce((s, p) => s + p.index, 0);
    return `
      <div class="team-roster-block">
        <div class="team-roster-head">
          <h3>${team.name}</h3>
          <span class="combined-hcp">Combined Index ${combined}</span>
        </div>
        <div class="roster-cards" style="--team-accent:var(--${team.accent});">
          ${roster.map(p => `
            <a class="tcard" href="#" data-player-card="${p.id}" title="${p.name}">
              <img src="../assets/players/${p.id}.png" alt="${p.name} trading card" loading="lazy"
                   onerror="tcardFallback(this, '${p.name.replace(/'/g, "\\'")}', ${p.index})">
            </a>`).join('')}
        </div>
      </div>`;
  }).join('');

  // ---------- schedule ----------
  const COURSE_DISPLAY = {
    'southern-hills': 'Southern Hills Plantation',
    'bay-hill': 'Bay Hill (Championship Course)',
    'bay-hill-charger': 'Bay Hill (Charger Course)',
    'evermore-cypress': 'Evermore Grand Cypress'
  };

  const days = [1, 2, 3, 4].map(dayNum => ROUNDS.filter(r => r.dayNum === dayNum));

  document.getElementById('schedule').innerHTML = days.map(dayRounds => {
    const r0 = dayRounds[0];
    return `
      <div class="sched-day">
        <div class="sched-daynum">
          <div class="dn">Day ${r0.dayNum}</div>
          <div class="dd">${r0.day}</div>
        </div>
        <div class="sched-body">
          ${dayRounds.map(r => {
            const course = COURSES[r.course];
            return `
              <div class="sched-block">
                <div class="sched-course">${COURSE_DISPLAY[r.course] || course.short}</div>
                <div class="sched-format">${r.format}${r.holes === 9 ? ' · 9 holes' : ''}</div>
                <div class="sched-times">
                  ${r.teeTimes ? r.teeTimes.map(t => `<span class="sched-time">${t}</span>`).join('')
                    : `<span class="sched-time">Tee times TBD</span>`}
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
</script>
<script type="module" src="../js/live-board.js"></script>
<script type="module" src="../js/player-card.js"></script>
</body>
</html>
