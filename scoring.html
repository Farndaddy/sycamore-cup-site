<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Live Scoring — 2026 Sycamore Cup Classic</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/scoring.css">
</head>
<body class="scoring-body">

<header class="site-header" id="site-header"></header>

<div class="scoring-shell">

  <!-- ============ IDENTITY BAR ============ -->
  <div class="ident-bar" id="ident-bar">
    <div class="wrap ident-inner">
      <div class="ident-who">
        <span class="ident-label">Scoring as</span>
        <strong id="ident-name">—</strong>
      </div>
      <button class="btn btn-sm btn-light" id="ident-switch" type="button">Change</button>
    </div>
  </div>

  <!-- ============ ROUND PICKER ============ -->
  <div class="round-bar">
    <div class="wrap">
      <select id="round-select" class="round-select" aria-label="Choose round"></select>
      <div class="round-meta" id="round-meta"></div>
    </div>
  </div>

  <!-- ============ TABS ============ -->
  <nav class="tabbar" id="tabbar" role="tablist">
    <button class="tab active" data-tab="card"   role="tab">My Card</button>
    <button class="tab"        data-tab="board"  role="tab">Leaderboard</button>
    <button class="tab"        data-tab="skins"  role="tab">Skins</button>
    <button class="tab"        data-tab="money"  role="tab">The Money</button>
  </nav>

  <main class="wrap scoring-main">
    <div id="status-banner"></div>

    <section class="tabpane active" id="pane-card"></section>
    <section class="tabpane" id="pane-board"></section>
    <section class="tabpane" id="pane-skins"></section>
    <section class="tabpane" id="pane-money"></section>
  </main>
</div>

<!-- ============ SIGN-IN SHEET ============ -->
<div class="sheet-backdrop" id="signin-sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="signin-title">
    <button class="sheet-close" id="signin-close" type="button" aria-label="Close" onclick="this.closest(&quot;.sheet-backdrop&quot;).hidden=true">&times;</button>
    <h2 id="signin-title">Whose card?</h2>
    <p class="muted" id="signin-sub">Anyone can enter scores for anyone &mdash; this just picks whose card you're looking at. We'll remember it on this phone, and you can switch any time.</p>
    <div class="name-grid" id="signin-names"></div>
  </div>
</div>

<!-- ============ SCORE KEYPAD ============ -->
<div class="sheet-backdrop" id="keypad-sheet" hidden>
  <div class="sheet keypad-sheet" role="dialog" aria-modal="true" aria-labelledby="keypad-title">
    <div class="keypad-head">
      <div>
        <span class="eyebrow" id="keypad-eyebrow">Hole</span>
        <h2 id="keypad-title">Hole 1</h2>
        <p class="muted" id="keypad-sub">Par 4 · 370 yds</p>
      </div>
      <div class="keypad-pops" id="keypad-pops"></div>
    </div>
    <div class="keypad-grid" id="keypad-grid"></div>
    <p class="keypad-note" id="keypad-note" hidden></p>
    <div class="sheet-actions">
      <button class="btn btn-quiet btn-sm" id="keypad-close" type="button">Close</button>
    </div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script type="module" src="js/scoring-page.js"></script>
</body>
</html>
