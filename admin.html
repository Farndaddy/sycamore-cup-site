<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — 2026 Sycamore Cup Classic</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/scoring.css">
<style>
  .admin-main { padding: 30px 0 80px; }
  .admin-sec {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 20px;
  }
  .admin-sec h2 {
    font-family: var(--font-display); font-weight: 500; font-size: 20px;
    margin: 0 0 4px;
  }
  .admin-sec .sec-note { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 18px; }
  .uid-box {
    font-family: var(--font-mono); font-size: 13px; word-break: break-all;
    background: var(--sand); padding: 12px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); margin: 12px 0;
  }
  .admin-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .admin-row:last-child { border-bottom: none; }
  .admin-row .r-main { flex: 1; min-width: 180px; }
  .admin-row .r-main strong { font-size: 14.5px; }
  .admin-row .r-main small { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 2px;
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  }
  .pill.claimed { background: var(--forest); color: #F3EFE4; }
  .pill.open { background: var(--sand); color: var(--ink-soft); }
  .pill.locked { background: var(--clay); color: #fff; }
  .admin-input {
    padding: 9px 11px; font-family: var(--font-mono); font-size: 13px;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--ivory); color: var(--ink); min-width: 120px;
  }
  .edit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px,1fr)); gap: 6px; margin-top: 12px; }
  .edit-cell { display: flex; flex-direction: column; gap: 3px; }
  .edit-cell label { font-size: 10px; color: var(--ink-soft); text-align: center; }
  .edit-cell input {
    width: 100%; padding: 8px 2px; text-align: center;
    font-family: var(--font-mono); font-size: 15px;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--ivory); color: var(--ink);
  }
  .admin-status { font-size: 13px; color: var(--forest); margin-top: 12px; min-height: 18px; }
  .admin-status.err { color: var(--clay); }
  .gate { text-align: center; padding: 70px 20px; }
  .hcp-field {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 8px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .hcp-field input {
    width: 62px; padding: 7px 8px; text-align: center;
    font-family: var(--font-mono); font-size: 14px;
    border: 1px solid var(--line-strong); border-radius: 3px; background: var(--paper);
  }
  .hcp-field input.is-pinned { border-color: var(--clay); color: var(--clay); font-weight: 600; }
  .hcp-pinned { color: var(--clay); font-weight: 600; }
  .gate h1 { font-family: var(--font-display); font-weight: 500; }
  .admin-flash {
    position: sticky; top: 0; z-index: 20;
    padding: 12px 16px; margin-bottom: 18px; border-radius: var(--radius);
    background: var(--forest); color: #F3EFE4; font-size: 14px;
  }
  .admin-flash[hidden] { display: none !important; }
  .admin-flash.err { background: var(--clay); }
</style>
</head>
<body>

<header class="site-header" id="site-header"></header>

<main class="wrap admin-main">
  <!-- Lives outside admin-root so a live database update can't wipe it. -->
  <div id="admin-flash" class="admin-flash" hidden></div>
  <div id="admin-root">
    <p class="muted">Connecting…</p>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script type="module" src="js/admin-page.js"></script>
</body>
</html>
